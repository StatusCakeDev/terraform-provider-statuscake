---
version: 2
archives:
- formats:
  - zip
  name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
before:
  hooks:
  - go mod download
builds:
- binary: "{{ .ProjectName }}_v{{ .Version }}"
  env:
  # goreleaser does not work with CGO, it could also complicate usage by users
  # in CI/CD systems where they may be unable to install libraries.
  - CGO_ENABLED=0
  flags:
  - -trimpath
  ldflags:
  - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
  goarch:
  - "386"
  - amd64
  - arm
  - arm64
  goos:
  - darwin
  - freebsd
  - linux
  - windows
  ignore:
  - goarch: "386"
    goos: darwin
  mod_timestamp: "{{ .CommitTimestamp }}"
changelog:
  disable: true
checksum:
  algorithm: sha256
  extra_files:
  - glob: terraform-registry-manifest.json
    name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
release:
  extra_files:
  - glob: terraform-registry-manifest.json
    name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  prerelease: auto
signs:
- artifacts: checksum
  args:
  # The `batch` flag must be specified to indicate signing should be
  # non-interactive.
  - --batch
  - --local-user
  - "{{ .Env.GPG_FINGERPRINT }}"
  - --output
  - ${signature}
  - --detach-sign
  - ${artifact}
